name: Build et release

# Un tag « v1.2.3 » publie une release GitHub avec ResMonNext-<version>-win-x64.exe :
# un fichier unique autonome (runtime .NET et DLL natives intégrés, aucun prérequis sur le poste).
# Les pushes sur main et les pull requests compilent et testent sans publier.
on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publier en fichier unique autonome
        run: >
          dotnet publish ResMonNext.csproj -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }} -p:DebugType=none
          -p:PublishAot=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=true -p:PublishReadyToRun=true
          -o out

      - name: Autotest (structures natives, collecte, pare-feu, trace ETW en administrateur)
        run: |
          $exe = Resolve-Path out/ResMonNext.exe
          $report = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $process = Start-Process $exe -ArgumentList "--selftest --out `"$report`"" -Wait -PassThru
          Get-Content $report
          if ($process.ExitCode -ne 0) { throw "Autotest en échec ($($process.ExitCode))" }

      - name: Empaqueter
        run: |
          $version = '${{ steps.version.outputs.value }}'
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/ResMonNext.exe "dist/ResMonNext-$version-win-x64.exe"
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N1} Mo" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v7
        with:
          name: ResMonNext-${{ steps.version.outputs.value }}
          path: dist/*

      - name: Release GitHub
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $notes = @"
          ## Téléchargement

          ``ResMonNext-$version-win-x64.exe`` : fichier unique autonome, à copier où vous voulez, aucun .NET requis (Windows 10/11 x64).

          Lancez-le en administrateur pour l'activité disque par fichier, le trafic réseau par processus,
          la latence TCP et la recherche de handles dans tous les processus.
          "@
          gh release create $env:GITHUB_REF_NAME dist/* --title "ResMon Next $version" --notes $notes --generate-notes
